[project]
name = "telecomcall"
version = "0.1.0"
description = "AI Voice Mobile Carrier Assistant - Replace human call centers with AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.121.2",
    "fastrtc[stt,tts,vad]>=0.0.33",
    "groq>=0.34.1",
    "langchain>=1.0.7",
    "langchain-groq>=1.0.1",
    "loguru>=0.7.3",
    "openai>=2.8.0",
    "pydantic>=2.11.10",
    "pydantic-settings>=2.12.0",
    "snac>=1.2.1",
    "torch>=2.9.1",
    "twilio>=9.8.6",
    "superlinked>=11.0.0",
    "pandas>=2.2.0",
    "opik>=1.0.0",
    "gradio>=5.0.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecomcall"]
